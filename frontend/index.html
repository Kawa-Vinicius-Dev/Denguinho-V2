<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f3eb" />
    <meta
      name="description"
      content="Denguinho: objetivos, apoio e conquistas em dupla."
    />
    <meta name="application-name" content="Denguinho" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Denguinho" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('denguinho-theme-v1') || 'light'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
      if (document.documentElement.dataset.theme === 'dark') {
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0b0908')
      }
    </script>
    <title>Denguinho — melhor quando é junto</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
