spring:
  datasource:
    url: jdbc:h2:mem:denguinho;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  jwt:
    secret: test-secret-that-is-longer-than-thirty-two-characters
    expiration: PT1H
  cors:
    allowed-origins: http://localhost:5173
  storage:
    path: target/test-photos

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
