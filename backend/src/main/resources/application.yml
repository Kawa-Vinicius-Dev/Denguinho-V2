spring:
  application:
    name: denguinho-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/denguinho}
    username: ${DB_USERNAME:denguinho}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  flyway:
    enabled: true

server:
  error:
    include-message: never

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: PT8H
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    path: ${APP_STORAGE_PATH:../storage/private/couple-photos}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

