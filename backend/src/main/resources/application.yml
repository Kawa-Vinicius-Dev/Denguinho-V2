spring:
  application:
    name: denguinho-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/denguinho}
    username: ${DB_USERNAME:denguinho}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      data-source-properties:
        ApplicationName: denguinho-api
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  flyway:
    enabled: true

server:
  error:
    include-message: never

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: PT8H
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    path: ${APP_STORAGE_PATH:../storage/private/couple-photos}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
